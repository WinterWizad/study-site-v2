<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIM 8th Semester Study Materials</title>
  <link rel="stylesheet" href="style.css">
  <!-- Marked.js for markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <!-- Highlight.js for code blocks -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>BIM 8th Semester</h1>
      <button id="themeToggle" aria-label="Toggle theme">🌙</button>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h2>Subjects</h2>
          <input type="search" id="searchInput" placeholder="Search..." aria-label="Search units">
        </div>
        <nav id="sidebarNav"></nav>
      </aside>

      <main class="content" id="content">
        <div class="welcome">
          <h2>Welcome</h2>
          <p>Select a subject and unit from the sidebar to start studying.</p>
          <div class="subject-cards" id="subjectCards"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="subjects.json"></script>
  <script src="app.js"></script>
</body>
</html>
