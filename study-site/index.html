<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BIM 8th Semester Exam Preparation - Study Materials Collection">
  <title>BIM 8th Semester Study Materials</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <!-- Import Map for WebAwesome dependencies -->
  <script type="importmap">
  {
    "imports": {
      "microlighter/grammar-dependencies.js": "https://cdn.jsdelivr.net/npm/microlighter@latest/dist/grammar-dependencies.js",
      "@shoelace-style/animations": "https://cdn.jsdelivr.net/npm/@shoelace-style/animations@1.2.0/dist/index.js",
      "@shoelace-style/localize": "https://cdn.jsdelivr.net/npm/@shoelace-style/localize@latest/dist/index.js"
    }
  }
  </script>

  <!-- WebAwesome CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.15.0/dist/styles/webawesome.min.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.15.0/dist/webawesome.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <wa-app>
    <header class="site-header">
      <div class="header-content">
        <div class="logo">
          <wa-icon name="mortarboard-fill" class="logo-icon"></wa-icon>
          <span class="logo-text">BIM 8th Semester</span>
        </div>
        <nav class="main-nav">
          <a href="#home" class="nav-link active" data-page="home">Home</a>
          <a href="#subjects" class="nav-link" data-page="subjects">Subjects</a>
          <a href="#search" class="nav-link" data-page="search">Search</a>
        </nav>
        <div class="header-actions">
          <button class="theme-toggle" aria-label="Toggle theme" title="Toggle dark/light mode">
            <wa-icon name="moon"></wa-icon>
          </button>
          <wa-button appearance="outline" size="small" href="#settings">
            <wa-icon name="gear" slot="start"></wa-icon>
            Settings
          </wa-button>
        </div>
      </div>
    </header>

    <main id="app" class="app-container">
      <!-- Dynamic content rendered here -->
    </main>

    <footer class="site-footer">
      <div class="footer-content">
        <p>BIM 8th Semester Exam Prep | Exam: 15 Bhadra | 4 Theory Papers</p>
        <p class="footer-note">Built for offline study • Data sourced from TU/FOM official syllabus & model questions</p>
      </div>
    </footer>

    <!-- Search Dialog -->
    <wa-dialog id="search-dialog" label="Search Study Materials" class="search-dialog">
      <div class="search-dialog-content">
        <wa-input
          id="search-input"
          type="search"
          placeholder="Search notes, questions, syllabus, diagrams..."
          clearable
          autocomplete="off"
        >
          <wa-icon name="search" slot="prefix"></wa-icon>
        </wa-input>
        <div id="search-results" class="search-results"></div>
      </div>
    </wa-dialog>

    <!-- Diagram Zoom Dialog -->
    <wa-dialog id="diagram-dialog" label="Diagram Viewer" class="diagram-dialog">
      <div class="diagram-dialog-content">
        <div id="diagram-container" class="diagram-container"></div>
      </div>
    </wa-dialog>

    <!-- Progress Dialog -->
    <wa-dialog id="progress-dialog" label="Study Progress" class="progress-dialog">
      <div id="progress-content" class="progress-content"></div>
    </wa-dialog>
  </wa-app>

  <script type="module" src="js/app.js"></script>
</body>
</html>
