<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="ladderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ladderGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ladderGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ladderGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="500" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#1a1a2e">Analytical Ladder (BI Scope)</text>
  <text x="300" y="65" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#64748b">Levels of analysis from descriptive to prescriptive</text>

  <!-- Ladder rungs -->
  <g font-family="Inter, sans-serif">
    <!-- Level 4: Prescriptive -->
    <g filter="url(#shadow)">
      <rect x="50" y="90" width="500" height="90" rx="12" fill="url(#ladderGrad4)"/>
    </g>
    <text x="100" y="135" font-size="18" font-weight="700" fill="white">4. PRESCRIPTIVE</text>
    <text x="100" y="160" font-size="13" fill="rgba(255,255,255,0.9)">What should we do?</text>
    <text x="400" y="135" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="end">Optimisation, Recommendation</text>
    <text x="400" y="160" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="end">Reorder quantities per store</text>
    <line x1="280" y1="105" x2="280" y2="175" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="5,5"/>

    <!-- Level 3: Predictive -->
    <g filter="url(#shadow)">
      <rect x="50" y="195" width="500" height="90" rx="12" fill="url(#ladderGrad3)"/>
    </g>
    <text x="100" y="240" font-size="18" font-weight="700" fill="white">3. PREDICTIVE</text>
    <text x="100" y="265" font-size="13" fill="rgba(255,255,255,0.9)">What will happen?</text>
    <text x="400" y="240" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="end">Forecasting, Data Mining Models</text>
    <text x="400" y="265" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="end">Next quarter's demand</text>
    <line x1="280" y1="210" x2="280" y2="280" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="5,5"/>

    <!-- Level 2: Diagnostic -->
    <g filter="url(#shadow)">
      <rect x="50" y="300" width="500" height="90" rx="12" fill="url(#ladderGrad2)"/>
    </g>
    <text x="100" y="345" font-size="18" font-weight="700" fill="white">2. DIAGNOSTIC</text>
    <text x="100" y="370" font-size="13" fill="rgba(255,255,255,0.9)">Why did it happen?</text>
    <text x="400" y="345" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="end">Drill-down, OLAP, Root-cause</text>
    <text x="400" y="370" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="end">Which product drove the drop</text>
    <line x1="280" y1="315" x2="280" y2="385" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="5,5"/>

    <!-- Level 1: Descriptive -->
    <g filter="url(#shadow)">
      <rect x="50" y="405" width="500" height="90" rx="12" fill="url(#ladderGrad)"/>
    </g>
    <text x="100" y="450" font-size="18" font-weight="700" fill="white">1. DESCRIPTIVE</text>
    <text x="100" y="475" font-size="13" fill="rgba(255,255,255,0.9)">What happened?</text>
    <text x="400" y="450" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="end">Dashboards, Reports</text>
    <text x="400" y="475" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="end">Last month's sales by branch</text>
  </g>

  <!-- Arrow on right side -->
  <g>
    <path d="M 570 450 L 570 135" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
      </marker>
    </defs>
    <text x="580" y="125" font-size="11" font-weight="600" fill="#2563eb" text-anchor="end" transform="rotate(-90, 580, 125)">Increasing Value →</text>
  </g>

  <!-- Side labels -->
  <g font-family="Inter, sans-serif" font-size="11" fill="#64748b">
    <text x="30" y="135" text-anchor="end" transform="rotate(-90, 30, 135)">Organisational Reach →</text>
    <text x="30" y="240" text-anchor="end" transform="rotate(-90, 30, 240)">Time Horizon →</text>
    <text x="30" y="345" text-anchor="end" transform="rotate(-90, 30, 345)">Decision Impact →</text>
    <text x="30" y="450" text-anchor="end" transform="rotate(-90, 30, 450)">Complexity →</text>
  </g>
</svg>