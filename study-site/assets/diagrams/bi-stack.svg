<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <defs>
    <linearGradient id="sourceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="integGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="storeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="analyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="presGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="700" height="500" fill="#fafafa"/>
  
  <text x="350" y="35" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#1a1a2e">The BI Stack</text>
  <text x="350" y="58" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#64748b">Data flows left-to-right; decisions flow right-to-left</text>

  <!-- Layer 1: Sources -->
  <g filter="url(#softShadow)">
    <rect x="20" y="90" width="120" height="340" rx="12" fill="url(#sourceGrad)"/>
  </g>
  <text x="80" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white">SOURCES</text>
  <g font-family="Inter, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">
    <text x="80" y="140" text-anchor="middle">ERP / POS</text>
    <text x="80" y="160" text-anchor="middle">CRM</text>
    <text x="80" y="180" text-anchor="middle">Excel / Flat</text>
    <text x="80" y="200" text-anchor="middle">Web / API</text>
    <text x="80" y="220" text-anchor="middle">Sensors</text>
    <text x="80" y="240" text-anchor="middle">External Data</text>
    <text x="80" y="260" text-anchor="middle">Logs</text>
    <text x="80" y="280" text-anchor="middle">Social Media</text>
    <text x="80" y="300" text-anchor="middle">Market Data</text>
    <text x="80" y="320" text-anchor="middle">Competitor</text>
    <text x="80" y="340" text-anchor="middle">Regulatory</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 140 260 L 180 260" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Layer 2: Integration -->
  <g filter="url(#softShadow)">
    <rect x="190" y="140" width="140" height="240" rx="12" fill="url(#integGrad)"/>
  </g>
  <text x="260" y="165" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white">INTEGRATION</text>
  <g font-family="Inter, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">
    <text x="260" y="190" text-anchor="middle">Extract</text>
    <text x="260" y="210" text-anchor="middle">Transform</text>
    <text x="260" y="230" text-anchor="middle">Load</text>
    <text x="260" y="250" text-anchor="middle">(ETL/ELT)</text>
    <text x="260" y="280" text-anchor="middle">Staging Area</text>
    <text x="260" y="300" text-anchor="middle">Clean, Conform</text>
    <text x="260" y="320" text-anchor="middle">De-duplicate</text>
    <text x="260" y="340" text-anchor="middle">Derive Fields</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 330 260 L 370 260" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Layer 3: Storage -->
  <g filter="url(#softShadow)">
    <rect x="380" y="140" width="140" height="240" rx="12" fill="url(#storeGrad)"/>
  </g>
  <text x="450" y="165" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white">STORAGE</text>
  <g font-family="Inter, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">
    <text x="450" y="190" text-anchor="middle">Data Warehouse</text>
    <text x="450" y="210" text-anchor="middle">(EDW)</text>
    <text x="450" y="230" text-anchor="middle">Star Schemas</text>
    <text x="450" y="250" text-anchor="middle">History Kept</text>
    <text x="450" y="280" text-anchor="middle">Data Marts</text>
    <text x="450" y="300" text-anchor="middle">(Sales, HR,</text>
    <text x="450" y="320" text-anchor="middle">Finance)</text>
    <text x="450" y="340" text-anchor="middle">Metadata Repo</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 520 260 L 560 260" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Layer 4: Analysis -->
  <g filter="url(#softShadow)">
    <rect x="530" y="180" width="140" height="160" rx="12" fill="url(#analyGrad)"/>
  </g>
  <text x="600" y="205" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white">ANALYSIS</text>
  <g font-family="Inter, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">
    <text x="600" y="230" text-anchor="middle">OLAP</text>
    <text x="600" y="250" text-anchor="middle">Mining</text>
    <text x="600" y="270" text-anchor="middle">Statistics</text>
    <text x="600" y="290" text-anchor="middle">Queries</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M 600 340 L 600 380" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Layer 5: Presentation -->
  <g filter="url(#softShadow)">
    <rect x="530" y="385" width="140" height="80" rx="12" fill="url(#presGrad)"/>
  </g>
  <text x="600" y="410" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white">PRESENTATION</text>
  <g font-family="Inter, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">
    <text x="600" y="430" text-anchor="middle">Dashboards</text>
    <text x="600" y="450" text-anchor="middle">Reports, Alerts, Mobile</text>
  </g>

  <!-- Arrow down to Decision -->
  <path d="M 600 465 L 600 490" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/>
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Decision Box -->
  <g filter="url(#softShadow)">
    <rect x="450" y="495" width="300" height="40" rx="8" fill="#dc2626"/>
  </g>
  <text x="600" y="520" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white">DECISION / ACTION</text>

  <!-- Metadata box on right -->
  <g filter="url(#softShadow)">
    <rect x="530" y="30" width="150" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  </g>
  <text x="605" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1e293b">METADATA</text>
  <g font-family="Inter, sans-serif" font-size="10" fill="#64748b">
    <text x="605" y="68" text-anchor="middle">Definitions</text>
    <text x="605" y="82" text-anchor="middle">Lineage</text>
    <text x="605" y="96" text-anchor="middle">Load Logs</text>
  </g>

  <!-- Labels at bottom -->
  <g font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#64748b">
    <text x="80" y="450" text-anchor="middle">Unit 1</text>
    <text x="260" y="450" text-anchor="middle">Unit 2</text>
    <text x="450" y="450" text-anchor="middle">Unit 2</text>
    <text x="600" y="450" text-anchor="middle">Unit 3, 5</text>
    <text x="600" y="590" text-anchor="middle">Unit 4, 6</text>
  </g>

  <!-- Key at bottom -->
  <g font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">
    <text x="350" y="590" text-anchor="middle">← Sources → Integration → Storage → Analysis → Presentation → Decision →</text>
  </g>
</svg>